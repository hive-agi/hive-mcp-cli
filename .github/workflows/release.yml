name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # attest-build-provenance mints a Sigstore certificate from the workflow's
  # OIDC identity and records the attestation; both need their own grant.
  id-token: write
  attestations: write

jobs:
  # A push to main is a RELEASE only when VERSION names a tag that does not exist
  # yet. Any other push (a test, a doc, a CI tweak) must leave the published
  # release alone: rebuilding it would replace the live binaries and SHA256SUMS
  # as a side effect, under a version number that did not change. Re-attaching
  # assets to an existing release is still possible, on purpose, by running this
  # workflow by hand.
  gate:
    name: Is this a release?
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          [ -n "$VERSION" ] || { echo "::error::VERSION is empty"; exit 1; }
          # --exit-code: 0 = tag found, 2 = no such tag, anything else = could not
          # ask. Guessing on the last would either skip a release or clobber one.
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null || rc=$?
          case "$rc" in
            2) echo "v${VERSION} is new: releasing"
               echo "release=true" >> "$GITHUB_OUTPUT" ;;
            0) if [ "$EVENT" = workflow_dispatch ]; then
                 echo "v${VERSION} exists; run by hand, so its assets are rebuilt and re-attached"
                 echo "release=true" >> "$GITHUB_OUTPUT"
               else
                 echo "::notice::v${VERSION} is already released, so this push is not a release. Bump VERSION to cut one."
                 echo "release=false" >> "$GITHUB_OUTPUT"
               fi ;;
            *) echo "::error::could not list tags on origin (git ls-remote exit $rc)"; exit 1 ;;
          esac

  release:
    name: Tag & Release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            echo "::error::VERSION file not found"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Raw binaries, not archives. install.sh fetches one file per tool and
      # chmods it; an archive would make the installer depend on tar being
      # present and on the layout inside it.
      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            for tool in hive hive-setup-mcp; do
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w" \
                -o "dist/$tool-$os-$arch" "./cmd/$tool"
            done
          done
          ls -l dist

      # The installer ships as a release asset too, so hive-mcp.com can redirect
      # at a RELEASE rather than at a branch: a push to main then changes nobody's
      # one-liner, only a deliberate release does. Being in dist/ also puts its
      # own sha256 inside the signed manifest.
      - name: Stage the installer
        run: cp install.sh dist/install.sh

      # The checksum manifest install.sh verifies every download against.
      - name: Checksum the binaries
        working-directory: dist
        run: |
          sha256sum hive-* install.sh > SHA256SUMS
          cat SHA256SUMS

      # The pinned key and the signing key must be the same key. Without this
      # gate, rotating one and not the other ships releases that every existing
      # installer refuses, and the failure surfaces on users' machines rather
      # than here. Presence of the secret is read as a STATUS; the value is
      # never interpolated anywhere it could be printed.
      - name: Check the signing key against the one install.sh pins
        id: signing
        env:
          HIVE_SIGNING_SECRET: ${{ secrets.HIVE_SIGNING_KEY }}
        run: |
          pinned=$(sed -n 's/^HIVE_SIGNING_KEY="\(.*\)"$/\1/p' install.sh | head -1)
          if [ -n "${HIVE_SIGNING_SECRET:-}" ]; then have_secret=yes; else have_secret=no; fi

          if [ -z "$pinned" ] && [ "$have_secret" = no ]; then
            echo "::warning::No signing key yet. This release will be UNSIGNED and install.sh will report tier 2 unavailable. Run bin/gen-signing-key to fix."
            echo "sign=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$pinned" ] && [ "$have_secret" = no ]; then
            echo "::error::install.sh pins a signing key but the HIVE_SIGNING_KEY secret is not set. Every installer in the field would refuse this release."
            exit 1
          fi
          if [ -z "$pinned" ] && [ "$have_secret" = yes ]; then
            echo "::error::A signing key is configured but install.sh pins none, so nothing would check the signature. Paste the public key into install.sh."
            exit 1
          fi

          printf '%s' "$HIVE_SIGNING_SECRET" | base64 -d > /tmp/signing.pem
          derived=$(openssl pkey -in /tmp/signing.pem -pubout -outform DER | base64 -w0)
          if [ "$derived" != "$pinned" ]; then
            echo "::error::The HIVE_SIGNING_KEY secret does not match the public key pinned in install.sh."
            exit 1
          fi
          echo "sign=yes" >> "$GITHUB_OUTPUT"

      - name: Sign SHA256SUMS
        if: steps.signing.outputs.sign == 'yes'
        working-directory: dist
        run: |
          openssl pkeyutl -sign -inkey /tmp/signing.pem -rawin \
            -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkeyutl -verify -pubin \
            -inkey <(openssl pkey -in /tmp/signing.pem -pubout) \
            -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
        shell: bash

      - name: Shred the key material
        if: always()
        run: rm -f /tmp/signing.pem

      # Names the workflow, repo and commit that produced each binary. This is
      # the tier a stolen signing key does not survive, because the attestation
      # is bound to a GitHub OIDC identity rather than to a key we hold.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/hive-*'

      - name: Create GitHub release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*

      # A release that already existed still gets the binaries. Reached only by a
      # hand-run (the gate job stops a push whose tag exists), which is the repair
      # path when a release was created without its assets: without it, an
      # install.sh pointing at that tag would 404 forever.
      - name: Attach binaries to an existing release
        if: steps.check_release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/* --clobber
